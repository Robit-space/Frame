name: Frame Rootless Build

on:
  push:
    branches:
      - v3
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Frame
        uses: actions/checkout@v4

      - name: Checkout pinned FrameApp source
        uses: actions/checkout@v4
        with:
          repository: Zerui18/FrameApp
          ref: c673963dd6b2d6852096a4b396a624169383ef20
          path: frameapp-src

      - name: Install build dependencies
        run: |
          brew install make dpkg ldid xz cocoapods

      - name: Apply FrameApp Chinese localization patch
        run: |
          cd frameapp-src
          base64 -D -i ../ci/frameapp.patch.b64 -o "$RUNNER_TEMP/frameapp.patch"
          git apply "$RUNNER_TEMP/frameapp.patch"
          test -f Frame.xcworkspace/contents.xcworkspacedata

      - name: Fix FrameApp CocoaPods target
        working-directory: frameapp-src
        run: |
          sed -i '' "s/target 'Frame' do/target 'FrameApp' do/" Podfile

      - name: Install FrameApp dependencies
        working-directory: frameapp-src
        run: |
          pod install --repo-update

      - name: List FrameApp build schemes
        working-directory: frameapp-src
        run: |
          test -f FrameApp.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -workspace FrameApp.xcworkspace

      - name: Build FrameApp
        working-directory: frameapp-src
        run: |
          xcodebuild \
            -workspace FrameApp.xcworkspace \
            -scheme FrameApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/FrameAppDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            build

      - name: Replace bundled FrameApp
        run: |
          PRODUCTS="$RUNNER_TEMP/FrameAppDerived/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/FrameApp.app"

          test -d "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$APP/Info.plist")

          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"

          # 清理旧版错误的 rootless 目录，防止重复打包
          rm -rf layout/var/jb

          # 清理旧 App，准备放入新编译的版本
          rm -rf layout/Applications/FrameApp.app
          mkdir -p layout/Applications

          ditto "$APP" layout/Applications/FrameApp.app

          rm -rf layout/Applications/FrameApp.app/_CodeSignature
          rm -f layout/Applications/FrameApp.app/embedded.mobileprovision

          APP="layout/Applications/FrameApp.app"

          # 检查 Nuke.framework 是否存在
          test -f "$APP/Frameworks/Nuke.framework/Nuke"

          # 对 App 内所有 Framework Mach-O 文件进行签名
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -print0 |
            while IFS= read -r -d '' BIN; do
              if file "$BIN" | grep -q 'Mach-O'; then
                echo "Signing: $BIN"
                ldid -S "$BIN"
              fi
            done
          fi

          # 主程序保留原有 entitlements
          ldid -Sframeapp-src/FrameApp/FrameApp_.entitlements \
            "$APP/$EXECUTABLE"

          # 检查 Nuke 签名
          ldid -e "$APP/Frameworks/Nuke.framework/Nuke"

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          path: theos
          submodules: recursive
          
      - name: Checkout iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: xybp888/iOS-SDKs
          ref: 4a48e5409f8ea6ac422c44d91b86fa0f8ae010ff
          path: sdk-source

      - name: Prepare SDK
        run: |
          mkdir -p theos/sdks
          cp -R sdk-source/iPhoneOS15.5.sdk theos/sdks/

      - name: Build Rootless package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          gmake package FINALPACKAGE=1 \
            THEOS="$THEOS" \
            SYSROOT="$THEOS/sdks/iPhoneOS15.5.sdk"

      - name: Verify package
        run: |
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"

          test -n "$DEB"

          echo "===== Package contents ====="
          dpkg-deb -c "$DEB"

          CONTENTS="$(dpkg-deb -c "$DEB")"

          # 必须存在正确的 App 路径
          echo "$CONTENTS" | grep -q 'var/jb/Applications/FrameApp.app/Info.plist'

          # 不允许重复嵌套 rootless 路径
          if echo "$CONTENTS" | grep -q 'var/jb/var/jb/'; then
            echo "ERROR: Duplicate rootless path detected!"
            exit 1
          fi

          echo "Package path verification passed."

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Rootless-iOS
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
